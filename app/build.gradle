plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.nhaba.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.nhaba.launcher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
